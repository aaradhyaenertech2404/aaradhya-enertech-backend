services:
  - type: web
    name: aaradhya-enertech-backend
    env: python
    region: singapore
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn core.wsgi:application --log-file -
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: DATABASE_URL
        sync: false
